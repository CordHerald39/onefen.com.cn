<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img">
<title>一分机场品牌纸雕插画</title>
<desc>纸飞机与一枚无字硬币，表达轻装出发。 原创可编辑矢量图，无外部素材。</desc>
<defs>
  <linearGradient id="onefen-paper" x1="0" y1="0" x2=".85" y2="1"><stop stop-color="#ffffff"/><stop offset=".6" stop-color="#f7f9f8"/><stop offset="1" stop-color="#e5ebe7"/></linearGradient>
  <linearGradient id="onefen-accent" x1=".15" y1="0" x2=".85" y2="1"><stop stop-color="#93b6ac"/><stop offset="1" stop-color="#2b6f5c"/></linearGradient>
  <linearGradient id="onefen-accentSoft" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e6eeeb"/><stop offset=".5" stop-color="#cadbd6"/><stop offset="1" stop-color="#91b4aa"/></linearGradient>
  <linearGradient id="onefen-leaf" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#abb79a"/><stop offset="1" stop-color="#5f785b"/></linearGradient>
  <linearGradient id="onefen-ink" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#536058"/><stop offset=".6" stop-color="#303c35"/><stop offset="1" stop-color="#19231d"/></linearGradient>
  <filter id="onefen-shadow" x="-35%" y="-35%" width="170%" height="190%"><feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#35443c" flood-opacity=".12"/></filter>
